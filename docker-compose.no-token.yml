# aws-local-lab :: no-token override
#
# Pins localstack/localstack:4.14.0 and forces LOCALSTACK_AUTH_TOKEN blank -
# the last LocalStack release that boots with NO auth token. This is the same
# image docker-compose.yml defaults to; this override just guarantees the
# tokenless path (fresh machine, CI, validation).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.no-token.yml up -d
#   make up NO_TOKEN=1
#
# The pin (localstack/localstack:4.14.0) is the last LocalStack release that
# boots fully offline with no auth token - see docs/foundation.md.
services:
  localstack:
    image: localstack/localstack:4.14.0
    environment:
      # Explicitly blank - the community image ignores it, kept for clarity.
      - LOCALSTACK_AUTH_TOKEN=
